[package]
name = "todo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# rhun-ext 1.4.1: protocol 1.1 (rhun 0.18)
rhun-ext = { git = "https://github.com/rhun-editor/extension-protocol", tag = "rust-v1.4.1" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
