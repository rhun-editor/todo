# The TODO tree: TODO, FIXME, XXX and HACK comments of the project in a sidebar section, grouped by
# file; a click opens the line. Every key: https://rhun.app/extensions/v1/ section 2 and v1.1
# "Retained views".
name = todo
owner = rhun-editor
title = TODO
description = The project's TODO, FIXME, XXX and HACK comments in a tree in the sidebar.
color = #c9a227
version = 0.1.1
protocol = 1
run.linux-x86_64 = bin/todo-linux-x86_64
run.macos-arm64 = bin/todo-macos-arm64
run.windows-x64 = bin/todo-windows-x64.exe
on = command

[commands]
rescan = TODO: Rescan

# a saved file scans again; rhun reports a document only when `opened` names it
[subscribe]
opened = *
saved = *

[needs]
project = read
# ripgrep when it is on PATH; a built-in walker otherwise
run = rg

[views]
todo.title = TODO
todo.place = sidebar
todo.kind = tree
todo.open = yes
